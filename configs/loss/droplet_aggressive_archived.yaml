loss:
  name: droplet
  status: archived_bad_first_schedule
  reason: >
    Mechanically stable but too aggressive by epoch 3.
    Validation normalized MAE worsened to 0.374723.

  base_loss: smooth_l1
  warmup_steps: auto_half_epoch
  anneal_steps: auto_three_epochs

  delta_start: 0.05
  delta_end: 0.50

  nu_start: 0.05
  nu_end: 1.00

  alpha_start: 0.05
  alpha_end: 1.00

  temp_start: 1.0
  temp_end: 25.0

  lambda_start: 0.0
  lambda_end: 1.0

  soft_gate: true
  min_weight: 0.05
  normalize_by_weight: true
  learnable_offsets: false
