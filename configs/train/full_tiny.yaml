seed: 42
device: cuda

paths:
  results_dir: results

data:
  root: /content/data/QM9
  train_size: 110000
  val_size: 10000
  smoke: false
  smoke_train_size: 20000
  smoke_val_size: 2000
  batch_size: 128
  num_workers: 0

model:
  name: tiny_radial_mpnn
  hidden_dim: 128
  num_layers: 3
  out_dim: 19

optimizer:
  name: adamw
  lr: 0.0003
  weight_decay: 0.000001
  grad_clip: 5.0

train:
  epochs: 5

metrics:
  primary: mean_normalized_mae
  save_per_target: true
