seed: 42
device: cuda

paths:
  results_dir: results

data:
  root: /content/data/QM9
  train_size: 110000
  val_size: 10000
  smoke: false          # full data — this is the real backbone, not a smoke test
  batch_size: 128
  num_workers: 4

model:
  name: painn           # equivariant backbone (vector features), pure PyTorch+PyG
  hidden_dim: 128
  num_layers: 3
  num_rbf: 20
  cutoff: 5.0
  out_dim: 19

optimizer:
  name: adamw
  lr: 0.0005
  weight_decay: 0.000001
  grad_clip: 5.0

train:
  epochs: 20

metrics:
  primary: mean_normalized_mae
  save_per_target: true
